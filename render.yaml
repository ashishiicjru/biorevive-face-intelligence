services:
  - type: web
    name: biorevive-face-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_DIR
        value: ./models
      - key: PRELOAD_MODELS
        value: "0"
      - key: AGE_BACKEND
        value: auto